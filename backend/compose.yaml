name: lahore-ride-booking

services:
  # Optional local broker. Start only with --profile messaging; no AWS account needed.
  localstack:
    build:
      context: ./infra
      dockerfile: LocalStack.Dockerfile
    profiles: ['messaging']
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '127.0.0.1:4566:4566'
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ride_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: lahore_rides
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ride_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ride_app -d lahore_rides']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ride_data:
